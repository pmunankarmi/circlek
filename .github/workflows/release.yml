name: Release WordPress plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4

      - name: Build installable plugin package
        run: |
          rm -f circlek-locations.zip
          zip -r circlek-locations.zip circlek-locations -x '*.DS_Store'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: circlek-locations.zip
